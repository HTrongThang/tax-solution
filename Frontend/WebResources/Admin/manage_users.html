<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấp Tài Khoản - TaxScraper</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/tailwind.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'tax-dark': '#2D3748', 'tax-blue': '#3182CE' }
                }
            }
        }
    </script>
</head>
<body class="antialiased text-gray-900 bg-white w-screen h-screen overflow-hidden select-none">

    <div class="login-card w-screen h-screen flex overflow-hidden bg-white border-none">
        <div class="w-[36%] bg-tax-dark p-9 flex flex-col justify-between text-white border-none">
            <div>
                <div class="w-13 h-13 bg-emerald-500 rounded-xl flex items-center justify-center mb-4 shadow-lg shadow-emerald-500/20">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold tracking-tight mb-1.5 text-emerald-400">Admin Panel</h1>
                <p class="text-gray-400 text-xs uppercase tracking-widest font-bold">Quản trị hệ thống</p>
            </div>

            <div class="space-y-3 text-xs text-gray-400">
                <div class="flex items-center gap-3">
                    <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>
                    <p>Cấp quyền nhân viên mới</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>
                    <p>Tự động đồng bộ dữ liệu hệ thống</p>
                </div>
            </div>
        </div>

        <div class="w-[64%] bg-white px-10 py-6 flex flex-col justify-center border-none">
            <div class="mb-4">
                <h2 class="text-xl font-bold text-gray-800 mb-0.5">Tạo thành viên mới</h2>
                <p class="text-gray-500 text-xs">Chào Admin, hãy thiết lập thông tin và phân quyền nhân sự.</p>
            </div>

            <div class="space-y-2.5">
                <!-- Hàng 1: Tên đăng nhập & Họ tên/Ghi chú -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-gray-500 tracking-wider mb-1">Tên đăng nhập (*)</label>
                        <div class="input-group">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            <input type="text" id="new_user" placeholder="Ví dụ: nhanvien01" class="tax-input" style="padding-top:0.6rem;padding-bottom:0.6rem">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-gray-500 tracking-wider mb-1">Họ tên / SĐT / Công ty</label>
                        <input type="text" id="new_fullname" placeholder="Ghi chú nhân sự / khách hàng" class="tax-input" style="padding:0.6rem 0.85rem">
                    </div>
                </div>

                <!-- Hàng 2: Mật khẩu & Xác nhận mật khẩu -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-gray-500 tracking-wider mb-1">Mật khẩu (*)</label>
                        <div class="input-group relative group">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            <input type="password" id="new_pass" placeholder="Mật khẩu tạm thời" class="tax-input pr-10" style="padding-top:0.6rem;padding-bottom:0.6rem">
                            <button type="button" onclick="togglePass('new_pass', 'eye_1')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-300 hover:text-emerald-500 transition-colors cursor-pointer">
                                <svg id="eye_1" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-gray-500 tracking-wider mb-1">Xác nhận mật khẩu (*)</label>
                        <div class="input-group relative group">
                            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                            <input type="password" id="confirm_pass" placeholder="Nhập lại mật khẩu" class="tax-input pr-10" style="padding-top:0.6rem;padding-bottom:0.6rem">
                            <button type="button" onclick="togglePass('confirm_pass', 'eye_2')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-300 hover:text-emerald-500 transition-colors cursor-pointer">
                                <svg id="eye_2" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Hàng 3: Mã máy (Hardware ID) -->
                <div>
                    <label class="block text-[10px] font-bold uppercase text-gray-500 tracking-wider mb-1">Mã máy hiện tại (Hardware ID)</label>
                    <input type="text" id="new_hwid" placeholder="Tự động lấy mã máy này (hoặc nhập mã máy khách)" class="tax-input font-mono" style="padding:0.6rem 0.85rem">
                </div>

                <!-- Hàng 4: Số MST tối đa & Cho phép AI -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-gray-500 tracking-wider mb-1">Số MST tối đa</label>
                        <input type="number" id="new_max_tax" min="0" value="5" class="tax-input" style="padding:0.6rem 0.85rem">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-gray-500 tracking-wider mb-1">Quyền giải Captcha tự động</label>
                        <label class="flex items-center gap-2.5 bg-[#F7FAFC] border border-[#E2E8F0] rounded-[0.6rem] px-3.5 text-xs font-medium text-gray-700 select-none cursor-pointer hover:border-emerald-400 transition-colors" style="height:39px">
                            <input type="checkbox" id="new_allow_ai" class="w-4 h-4 rounded border-gray-300 accent-emerald-600 cursor-pointer">
                            <span>Cho phép AI giải captcha</span>
                        </label>
                    </div>
                </div>

                <!-- Hàng 5: Ngày bắt đầu & Ngày kết thúc -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-gray-500 tracking-wider mb-1">Ngày bắt đầu</label>
                        <input type="date" id="new_start" class="tax-input" style="padding:0.6rem 0.85rem">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-gray-500 tracking-wider mb-1">Ngày kết thúc</label>
                        <input type="date" id="new_end" class="tax-input" style="padding:0.6rem 0.85rem">
                    </div>
                </div>

                <div class="pt-1.5">
                    <button onclick="postThemThanhVien()" id="btnSubmitAdmin"
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-3 rounded-xl shadow-md shadow-emerald-200 transition-all transform active:scale-[0.98] uppercase tracking-wider flex items-center justify-center gap-2 cursor-pointer">
                        <span>Xác nhận cấp quyền</span>
                    </button>
                </div>
            </div>

            <div class="mt-4 text-center">
                <button onclick="quayLaiDangNhap()" class="text-[11px] text-gray-400 hover:text-emerald-600 font-bold uppercase tracking-widest transition-colors cursor-pointer">
                    ← Quay lại đăng nhập
                </button>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
