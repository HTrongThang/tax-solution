<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấp Tài Khoản - TaxScraper</title>
    <link rel="stylesheet" href="/css/style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'tax-dark': '#2D3748', 'tax-blue': '#3182CE' }
                }
            }
        }
    </script>
    <style>
        /* Trang Admin có nhiều ô hơn trang Login: cho thẻ tự giãn chiều cao và cuộn được */
        body { height: auto; min-height: 100vh; overflow-y: auto; }
        .login-card { height: auto; min-height: 540px; }
    </style>
</head>
<body class="antialiased text-gray-900 bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="login-card shadow-2xl overflow-hidden flex bg-white rounded-3xl max-w-4xl w-full border-none">
        <div class="w-[40%] bg-tax-dark p-10 flex flex-col justify-between text-white border-none">
            <div>
                <div class="w-14 h-14 bg-emerald-500 rounded-xl flex items-center justify-center mb-5 shadow-lg shadow-emerald-500/20">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold tracking-tight mb-2 text-emerald-400">Admin Panel</h1>
                <p class="text-gray-400 text-sm mb-16 uppercase tracking-widest font-bold">Quản trị hệ thống</p>
            </div>

            <div class="space-y-4 text-xs text-gray-400">
                <div class="flex items-center gap-3">
                    <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>
                    <p>Cấp quyền nhân viên mới</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>
                    <p>Tự động lưu vào dữ liệu hệ thống</p>
                </div>
            </div>
        </div>

        <div class="w-[60%] bg-white p-14 flex flex-col justify-center border-none">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-1">Tạo thành viên mới</h2>
                <p class="text-gray-500 text-sm">Chào Admin, hãy thiết lập thông tin nhân sự.</p>
            </div>

            <div class="space-y-5">
                <div class="input-group">
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    <input type="text" id="new_user" placeholder="Tên nhân viên (ví dụ: nhanvien01)" class="tax-input">
                </div>

                <div class="input-group relative group">
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    <input type="password" id="new_pass" placeholder="Mật khẩu tạm thời" class="tax-input pr-12">
                    <button type="button" onclick="togglePass('new_pass', 'eye_1')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 hover:text-emerald-500 transition-colors">
                        <svg id="eye_1" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                    </button>
                </div>

                <div class="input-group relative group">
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                    <input type="password" id="confirm_pass" placeholder="Xác nhận lại mật khẩu" class="tax-input pr-12">
                    <button type="button" onclick="togglePass('confirm_pass', 'eye_2')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 hover:text-emerald-500 transition-colors">
                        <svg id="eye_2" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                    </button>
                </div>

                <div class="input-group">
                    <input type="text" id="new_fullname" placeholder="Họ tên / SĐT / Công ty (ghi chú)" class="tax-input" style="padding-left:1rem">
                </div>

                <div class="input-group">
                <div>
                    <label class="text-[10px] font-bold uppercase text-gray-400 tracking-wider">Mã máy hiện tại (Hardware ID)</label>
                    <input type="text" id="new_hwid" placeholder="Tự động lấy mã máy này (hoặc để trống)" class="tax-input font-mono" style="padding-left:1rem">
                </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-bold uppercase text-gray-400 tracking-wider">Số MST tối đa</label>
                        <input type="number" id="new_max_tax" min="0" value="5" class="tax-input" style="padding-left:1rem">
                    </div>
                    <label class="flex items-end gap-2 pb-3 text-sm text-gray-600 select-none cursor-pointer">
                        <input type="checkbox" id="new_allow_ai" class="w-4 h-4 rounded border-gray-300">
                        Cho phép AI giải captcha
                    </label>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-gray-400 tracking-wider">Ngày bắt đầu</label>
                        <input type="date" id="new_start" class="tax-input" style="padding-left:1rem">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-gray-400 tracking-wider">Ngày kết thúc</label>
                        <input type="date" id="new_end" class="tax-input" style="padding-left:1rem">
                    </div>
                </div>

                <div class="py-2"></div>

                <button onclick="postThemThanhVien()"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold py-4 rounded-xl shadow-lg shadow-emerald-200 transition-all transform active:scale-[0.98] uppercase tracking-wide">
                    Xác nhận cấp quyền
                </button>
            </div>

            <div class="mt-10 text-center">
                <button onclick="window.location.href='/login.html'" class="text-[10px] text-gray-400 hover:text-emerald-600 font-bold uppercase tracking-[0.2em] transition-colors">
                    ← Quay lại đăng nhập
                </button>
            </div>
        </div>
    </div>

    <script src="/js/tailwind.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
