<header class="bg-white/90 backdrop-blur-md sticky top-0 z-40 border-b border-slate-100 px-8 py-4 flex justify-between items-center rounded-b-[2rem] shadow-xl shadow-slate-200/40">

    <div class="flex items-center gap-4">
        <div class="flex flex-col">
            <h2 class="text-2xl font-black text-tax-dark uppercase tracking-tighter italic leading-none">
                Crawler Control
            </h2>
            <div class="flex items-center gap-2 mt-1">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span class="text-[10px] font-black text-emerald-600 uppercase tracking-widest">Hệ thống sẵn sàng</span>
            </div>
        </div>
    </div>

    <div class="flex items-center gap-4">
        <div class="text-right border-r pr-4 border-slate-200">
            <p id="header_user_name" class="text-sm font-bold text-slate-900 leading-tight">
                Đang tải...
            </p>
            <p id="header_user_role" class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-0.5">
                ---
            </p>
        </div>

        <div class="group relative cursor-pointer">
            <div id="header_user_avatar" class="w-12 h-12 rounded-2xl bg-tax-dark flex items-center justify-center font-black text-emerald-400 text-lg shadow-inner border-2 border-emerald-500/10 transition-all group-hover:border-emerald-500/50">
                --
            </div>
            <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-emerald-500 border-2 border-white rounded-full"></div>
        </div>
    </div>

    <script>
        (function () {
            // 1. Lấy dữ liệu từ "túi áo" LocalStorage mà C# đã gửi sang
            const name = localStorage.getItem('user_name');
            const role = localStorage.getItem('user_role');
            const initials = localStorage.getItem('user_initials');

            // 2. Nếu tìm thấy dữ liệu thì cập nhật ngay lên giao diện
            if (name) {
                const nameEl = document.getElementById('header_user_name');
                if (nameEl) nameEl.innerText = name;
            }

            if (role) {
                const roleEl = document.getElementById('header_user_role');
                if (roleEl) roleEl.innerText = role;
            }

            if (initials) {
                const avatarEl = document.getElementById('header_user_avatar');
                if (avatarEl) avatarEl.innerText = initials;
            }

            console.log("Header: Đã cập nhật thông tin người dùng từ LocalStorage.");
        })();
    </script>
</header>
