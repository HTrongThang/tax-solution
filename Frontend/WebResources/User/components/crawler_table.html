<div class="flex flex-col gap-4 animate-in fade-in duration-500">
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-3">
        <div class="flex items-center justify-between gap-4 pb-3 border-b border-slate-100">
            <div class="flex items-center gap-2 flex-1">
                <div class="bg-slate-100 p-2 rounded-lg text-slate-500">🏢</div>
                <select id="select-company"
                        class="bg-transparent text-sm font-bold text-slate-700 outline-none cursor-pointer hover:text-emerald-600 transition-colors
                     max-w-[300px] overflow-hidden text-ellipsis whitespace-nowrap">
                    <option value="">Đang tải danh sách...</option>
                </select>
                <button id="btn-auth"
                        onclick="handleAuthAction(this)"
                        class="ml-2 text-[10px] font-bold px-3 py-1 rounded-md transition-all uppercase active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white">
                    Đăng nhập
                </button>

            </div>
          
        </div>


        <div class="flex items-center justify-between pt-3">
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2 bg-slate-50 px-2 py-1.5 rounded-xl border border-slate-100">
                    <span class="text-[10px] font-bold text-slate-400 uppercase pl-1">Kỳ:</span>
                    <select id="select-period" class="bg-transparent text-[11px] font-bold text-slate-700 outline-none cursor-pointer hover:text-emerald-600 transition-colors">
                        <!--<option value="this-month">Tháng này</option>
                        <option value="01">Tháng 01</option>
                        <option value="02">Tháng 02</option>
                        <option value="03">Tháng 03</option>
                        <option value="04">Tháng 04</option>
                        <option value="05">Tháng 05</option>
                        <option value="06">Tháng 06</option>
                        <option value="07">Tháng 07</option>
                        <option value="08">Tháng 08</option>
                        <option value="09">Tháng 09</option>
                        <option value="10">Tháng 10</option>
                        <option value="11">Tháng 11</option>
                        <option value="12">Tháng 12</option>
                        <option value="quarter-1">Quý 1</option>
                        <option value="quarter-2">Quý 2</option>
                        <option value="quarter-3">Quý 3</option>
                        <option value="quarter-4">Quý 4</option>
                        <option value="this-year">Cả năm</option>-->
                    </select>
                </div>
                <div class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-100">
                    <!-- hidden native ISO date inputs for reliable parsing -->
                    <input type="date" id="date-from-iso" value="2026-04-01" max="2026-04-15" class="hidden">
                    <input type="text"
                           id="date-from"
                           value="01/01/2026"
                           placeholder="dd/mm/yyyy"
                           class="bg-transparent text-[11px] font-mono outline-none text-slate-600 w-[95px] cursor-pointer">

                    <span class="text-slate-300">→</span>

                    <input type="date" id="date-to-iso" value="2026-04-13" max="2026-04-15" class="hidden">
                    <input type="text"
                           id="date-to"
                           value="07/01/2026"
                           placeholder="dd/mm/yyyy"
                           class="bg-transparent text-[11px] font-mono outline-none text-slate-600 w-[95px] cursor-pointer">
                </div>
            </div>

            <div class="flex items-center gap-1 bg-slate-50/80 p-1 rounded-2xl border border-slate-100">
                <button onclick="handleSearchClick()"
                        class="bg-slate-900 text-white px-4 py-2 rounded-xl text-[11px] font-bold hover:bg-emerald-600 transition-all flex items-center gap-2 uppercase shadow-sm active:scale-95">
                    🔍 Tìm kiếm
                </button>

                <div class="w-[1px] h-6 bg-slate-200 mx-1"></div>

                <button id="btn-export-xml"
                        onclick="handleExportXml(this)"
                        class="px-2 py-1.5 text-[10px] font-bold text-slate-600 hover:bg-white hover:text-blue-600 rounded-lg transition-all flex items-center gap-1.5 border border-transparent hover:border-slate-200">
                    <span class="text-sm">📄</span> XML-HTML
                </button>

                <button id="btn-export-pdf" class="px-2 py-1.5 text-[10px] font-bold text-slate-600 hover:bg-white hover:text-red-600 rounded-lg transition-all flex items-center gap-1.5 border border-transparent hover:border-slate-200">
                    <span class="text-sm">📕</span> PDF GỐC
                </button>

                <button class="px-2 py-1.5 text-[10px] font-bold text-slate-600 hover:bg-white hover:text-emerald-600 rounded-lg transition-all flex items-center gap-1.5 border border-transparent hover:border-slate-200">
                    <span class="text-sm">📗</span> EXCEL
                    <span class="text-[8px] opacity-50 ml-0.5">▼</span>
                </button>

                <button class="px-2 py-1.5 text-[10px] font-bold text-slate-500 hover:bg-white hover:text-slate-900 rounded-lg transition-all flex items-center gap-1.5 border border-transparent hover:border-slate-200">
                    <span class="text-sm">⚖️</span> ĐỐI CHIẾU
                    <span class="text-[8px] opacity-50 ml-0.5">▼</span>
                </button>
            </div>
        </div>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[1000px]">
                <thead>
                    <tr class="border-b border-slate-100 bg-slate-50/50">
                        <th class="py-4 px-4 text-[10px] font-bold uppercase text-slate-500 w-12 text-center">STT</th>
                        <th class="py-4 px-4 text-[10px] font-bold uppercase text-slate-500">Mã số thuế / Ký hiệu</th>
                        <th class="py-4 px-4 text-[10px] font-bold uppercase text-slate-500">Số hóa đơn / Ngày</th>
                        <th class="py-4 px-4 text-[10px] font-bold uppercase text-slate-500 text-right">Giá trị thanh toán</th>
                        <th class="py-4 px-4 text-[10px] font-bold uppercase text-slate-500 text-center">Kiểm tra thuế</th>
                        <th class="py-4 px-4 text-[10px] font-bold uppercase text-slate-500 text-center">Trạng thái</th>
                        <th class="py-4 px-4 text-[10px] font-bold uppercase text-slate-500 w-10"></th>
                    </tr>
                </thead>
                <tbody id="crawler-results-body" class="divide-y divide-slate-50">
                </tbody>
            </table>
        </div>
        <div class="px-4 py-3 bg-white/80 border-t border-slate-100 flex items-center justify-between">
            <div id="crawler-pagination-info" class="text-[12px] text-slate-500"></div>
            <div id="crawler-pagination" class="text-sm flex items-center gap-2"></div>
        </div>
    </div>
</div>

<div id="captcha-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center">
    <div class="bg-white p-6 rounded-2xl shadow-2xl w-[350px] border border-slate-200">
        <h3 class="text-red-600 font-bold text-center uppercase text-sm mb-4">Nhập mã captcha xác thực</h3>

        <div class="bg-slate-100 rounded-lg p-3 flex justify-center mb-4 border border-dashed border-slate-300">
            <img id="img-captcha" src="https://via.placeholder.com/150x50?text=4WSANG" alt="captcha" class="h-12">
        </div>

        <input type="text" id="input-captcha" placeholder="Mã xác nhận" autocomplete="off"
               class="w-full border-b-2 border-slate-200 outline-none focus:border-emerald-500 text-center text-xl font-mono tracking-widest py-2 mb-6 uppercase">

        <div class="flex gap-2">
            <button onclick="closeCaptcha()" class="flex-1 py-2 rounded-xl bg-slate-100 text-slate-600 font-bold text-[11px] uppercase hover:bg-slate-200">Hủy</button>
            <button onclick="submitCaptcha()" class="flex-1 py-2 rounded-xl bg-slate-900 text-white font-bold text-[11px] uppercase hover:bg-emerald-600">Xác nhận</button>
        </div>
    </div>
</div>

<div id="crawler-status-box"
     style="display: none !important; position: fixed; top: 100px; left: 50%; transform: translateX(-50%); z-index: 2147483647; width: 350px; pointer-events: none;"
     class="bg-white p-4 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.3)] border border-emerald-100 flex items-center gap-4">

    <div id="crawler-spinner" class="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin flex-shrink-0"></div>

    <div class="flex flex-col min-w-0">
        <span id="crawler-current-status" class="text-sm font-bold text-slate-800 leading-tight">Đang chuẩn bị...</span>
        <span id="crawler-sub-detail" class="text-[10px] text-slate-400 mt-1 truncate">Đang kết nối hệ thống thuế...</span>
    </div>
</div>
