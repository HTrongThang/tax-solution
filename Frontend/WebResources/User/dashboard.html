<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxSolution Dashboard - ACC Online</title>
    <script src="/js/tailwind.js"></script>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        ::-webkit-scrollbar {
            display: none;
        }

        /* Ẩn cho IE, Edge và Firefox */
        html,
        body {
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tax-dark': '#1A202C',
                        'tax-emerald': '#10b981'
                    },
                    borderRadius: { '3xl': '1.5rem', '4xl': '2rem' }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 antialiased font-sans">

    <div class="flex min-h-screen">
        <aside id="sidebar-slot"
            class="w-[17rem] fixed inset-y-0 left-0 z-40 bg-tax-dark overflow-y-auto shadow-2xl shadow-tax-dark/30 transition-all duration-300 ease-in-out">
        </aside>

        <div id="main-wrapper" class="flex-1 flex flex-col ml-[17rem] transition-all duration-300 ease-in-out">

            <!-- <header id="header-slot"
                class="p-2 sticky top-0 z-30 bg-slate-50/90 backdrop-blur-md border-b border-slate-200">
            </header> -->

            <main id="main-content-slot" class="flex-1 p-2">
                <div class="flex items-center justify-center h-64 text-slate-300">
                    <div class="text-center">
                        <div
                            class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto mb-4">
                        </div>
                        <p class="animate-pulse font-medium text-slate-500">Đang khởi tạo hệ thống...</p>
                    </div>
                </div>
            </main>

            <footer id="footer-slot" class="mt-auto text-center border-t border-slate-100 text-slate-400 text-sm">
            </footer>
        </div>
    </div>

    <div id="modal-slot" class="relative z-[9999]"></div>

    <script src="/js/sidebar.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/tax-account-manager.js"></script>
    <script src="/js/invoiceRamManager.js"></script>
    <script src="/js/crawlerTable.js"></script>
    <script src="/js/exportBaoCaoTongHop.js"></script>
    <script src="/js/xmlInvoiceParser.js"></script>


    <script>

        // Tự động load trang mặc định khi website vừa tải xong

        // Hàm nạp linh kiện dùng chung
        async function includeComponent(slotId, filePath) {
            const slot = document.getElementById(slotId);
            if (!slot) return;

            try {
                // Thêm tham số ngẫu nhiên để tránh lỗi cache của WebView2 khi Thắng sửa file
                const response = await fetch(filePath + '?v=' + Math.random());
                if (!response.ok) throw new Error("Không tìm thấy file: " + filePath);

                const html = await response.text();
                slot.innerHTML = html;

                // Làm tươi lại cấu hình Tailwind sau khi nạp HTML mới
                if (window.tailwind) {
                    tailwind.config = tailwind.config;
                }
                console.log(`[Success] Đã nạp: ${filePath}`);
            } catch (err) {
                console.error(`[Error] Lỗi nạp component ${filePath}:`, err);
                slot.innerHTML = `<div class="p-4 text-red-500 bg-red-50 rounded-2xl border border-red-100 text-sm">
                                        Lỗi nạp thành phần: ${filePath}
                                    </div>`;
            }
        }

        // Luồng khởi chạy chính
        window.addEventListener('DOMContentLoaded', async () => {
            // 1. Chạy song song nạp các thành phần KHUNG (Sidebar, Header, Footer)
            // Dùng await để đảm bảo Sidebar phải có trong DOM trước khi tìm nút bấm
            await Promise.all([
                includeComponent('sidebar-slot', 'components/sidebar.html'),
                includeComponent('header-slot', 'header.html'),
                includeComponent('footer-slot', 'footer.html'),
                includeComponent('modal-slot', 'components/logout_modal.html')
            ]);

            // Cập nhật số phiên bản vào các component vừa nạp
            const savedVer = localStorage.getItem('app_version') || 'v1.0.0';
            document.querySelectorAll('.app-version-text').forEach(el => el.innerText = savedVer);

            console.log("Hệ thống: Khung giao diện đã sẵn sàng.");

            // 2. Sau khi Sidebar nạp xong, mới tìm nút 'default-nav' để kích hoạt
            const defaultNav = document.getElementById('default-nav');

            if (defaultNav) {
                console.log("Hệ thống: Đang nạp trang mặc định...");
                // Gọi loadPage để nạp trang Crawler và kích hoạt màu sắc menu
                window.loadPage('components/crawler_table.html', defaultNav);
            } else {
                // Trường hợp dự phòng nếu không tìm thấy ID nút
                console.warn("Hệ thống: Không tìm thấy default-nav, nạp trực tiếp trang.");
                includeComponent('main-content-slot', 'components/crawler_table.html');
            }
        });
    </script>
</body>

</html>
