<main class="max-w-[99%] mx-auto w-full space-y-[2vh] animate-in fade-in duration-300">
    <div class="border-b-2 border-slate-200 pb-[1.5vh]">
        <h1 class="font-bold text-slate-800 tracking-tight" style="font-size: clamp(1.25rem, 2vw, 2.25rem);">
            Quản trị danh sách MST
        </h1>
        <p class="text-slate-500 mt-1 font-medium" style="font-size: clamp(0.75rem, 1vw, 1rem);">
            Lưu trữ Mã số thuế để khởi tạo tiến trình khai thác tự động.
        </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-[3vw]">
        <div class="md:col-span-4 space-y-[2vh]">
            <div class="bg-white border-2 border-slate-200 rounded-2xl p-[1vw] shadow-md">
                <h3 class="font-black text-slate-700 mb-[1vh] uppercase tracking-widest" style="font-size: clamp(0.75rem, 1vw, 1.125rem);">
                    Thêm mới
                </h3>

                <div class="space-y-[3vh]">
                    <div class="group">
                        <label class="flex items-center gap-2 font-bold text-slate-600 mb-2 ml-1 transition-colors group-focus-within:text-blue-600" style="font-size: clamp(0.75rem, 1vw, 1.1rem);">
                            <span>🏢</span> Mã số thuế doanh nghiệp
                        </label>
                        <div class="relative">
                            <input type="text" id="mst_input" maxlength="14"
                                   class="w-full bg-slate-50 border-2 border-slate-200 p-[0.7vw] pl-[3vw] rounded-2xl outline-none focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all font-bold tracking-[0.1em] shadow-sm"
                                   style="font-size: clamp(1rem, 1.4vw, 1.4rem);" placeholder="03xxxxxxxx"
                                   onkeypress="if(event.key === 'Enter') document.getElementById('company_input').focus()">
                            <span class="absolute left-[1vw] top-1/2 -translate-y-1/2 opacity-30 text-[1.2vw]">🆔</span>
                        </div>
                    </div>

                    <div class="group">
                        <label class="flex items-center gap-2 font-bold text-slate-600 mb-2 ml-1 transition-colors group-focus-within:text-blue-600" style="font-size: clamp(0.75rem, 1vw, 1.1rem);">
                            <span>🏢</span> Tên đơn vị / Công ty
                        </label>
                        <div class="relative">
                            <input type="text" id="company_input"
                                   class="w-full bg-slate-50 border-2 border-slate-200 p-[0.7vw] pl-[3vw] rounded-2xl outline-none focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all font-semibold italic shadow-sm"
                                   style="font-size: clamp(1rem, 1.4vw, 1.4rem);" placeholder="Công ty TNHH..."
                                   onkeypress="if(event.key === 'Enter') document.getElementById('pass_input').focus()">
                            <span class="absolute left-[1vw] top-1/2 -translate-y-1/2 opacity-30 text-[1.2vw]">🏛️</span>
                        </div>
                    </div>

                    <div class="group">
                        <label class="flex items-center gap-2 font-bold text-slate-600 mb-2 ml-1 transition-colors group-focus-within:text-blue-600" style="font-size: clamp(0.75rem, 1vw, 1.1rem);">
                            <span>🔒</span> Mật khẩu hệ thống
                        </label>
                        <div class="relative">
                            <input type="password" id="pass_input"
                                   class="w-full bg-slate-50 border-2 border-slate-200 p-[0.7vw] pl-[3vw] rounded-2xl outline-none focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all tracking-[0.3em]"
                                   style="font-size: clamp(1rem, 1.4vw, 1.4rem);" placeholder="••••••••"
                                   onkeypress="if(event.key === 'Enter') addToTempList()">
                            <span class="absolute left-[1vw] top-1/2 -translate-y-1/2 opacity-30 text-[1.2vw]">🔑</span>
                        </div>
                    </div>

                    <button onclick="addToTempList()" class="w-full py-[2vh] bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-black transition-all active:scale-[0.98] shadow-xl shadow-blue-500/20 hover:shadow-blue-500/40 tracking-widest flex items-center justify-center gap-3 group">
                        <span>THÊM VÀO HÀNG CHỜ</span>
                        <span class="transition-transform group-hover:translate-x-1">🚀</span>
                    </button>
                </div>
            </div>

            <div class="p-[1.5vw] bg-blue-50 border-2 border-blue-100 rounded-2xl">
                <p class="text-blue-600 leading-relaxed font-bold" style="font-size: clamp(0.75rem, 0.9vw, 1rem);">
                    💡 Mẹo: Nhấn Enter ở ô mật khẩu để thêm nhanh.
                </p>
            </div>
        </div>

        <div class="md:col-span-8 space-y-6">
            <div class="bg-white border-2 border-slate-200 rounded-2xl shadow-md overflow-hidden flex flex-col" style="min-height: 60vh;">
                <div class="p-[0.5vw] bg-slate-50 border-b-2 border-slate-200 flex justify-between items-center">
                    <span class="font-black text-slate-600 uppercase tracking-widest" style="font-size: clamp(0.75rem, 1vw, 1.1rem);">
                        Danh sách MST đã lưu
                    </span>
                    <button id="btnSaveAll" onclick="submitAllToCSharp()" class="hidden px-[2vw] py-[1vh] bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-black transition-all shadow-md tracking-widest uppercase">
                        LƯU <span id="count_badge" class="bg-white text-emerald-600 px-2 rounded-md mx-1">0</span> MST VÀO JSON ✅
                    </button>
                </div>

                <div class="border-t border-slate-200">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="border-b border-slate-200 bg-slate-50/50">
                                <th class="py-3 px-4 text-[11px] font-bold text-slate-900 uppercase tracking-wider w-[50px] text-center">STT</th>

                                <th class="py-3 px-2 text-[11px] font-bold text-slate-900 uppercase tracking-wider w-[150px]">Mã số thuế</th>

                                <th class="py-3 px-2 text-[11px] font-bold text-slate-900 uppercase tracking-wider w-auto">Tên công ty</th>

                                <th class="py-3 px-2 text-[11px] font-bold text-slate-900 uppercase tracking-wider w-[120px]">Ngày thêm</th>

                                <th class="py-3 px-4 text-[11px] font-bold text-slate-900 uppercase tracking-wider w-[100px] text-right">Chức năng</th>
                            </tr>
                        </thead>
                        <tbody id="temp_tax_list" class="text-slate-600">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
