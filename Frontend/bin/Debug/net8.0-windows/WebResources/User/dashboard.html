<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxSolution Dashboard - ACC Online</title>
    <script src="/js/tailwind.js"></script>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        ::-webkit-scrollbar {
            display: none;
        }

        /* Ẩn cho IE, Edge và Firefox */
        html, body {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tax-dark': '#1A202C',
                        'tax-emerald': '#10b981'
                    },
                    borderRadius: { '3xl': '1.5rem', '4xl': '2rem' }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 antialiased font-sans">

    <div class="flex min-h-screen">
        <aside id="sidebar-slot" class="w-72 fixed inset-y-0 left-0 z-40 bg-tax-dark overflow-y-auto shadow-2xl shadow-tax-dark/30"></aside>

        <div class="flex-1 flex flex-col ml-72">
            <header id="header-slot" class="p-4 sticky top-0 z-30 bg-slate-50/90 backdrop-blur-md"></header>

            <main id="main-content-slot" class=" flex-1">
                <div class="flex items-center justify-center h-64 text-slate-300">
                    <p class="animate-pulse font-medium">Đang khởi tạo hệ thống...</p>
                </div>
            </main>

            <footer id="footer-slot" class="mt-auto p-8 text-center border-t border-slate-100 text-slate-400 text-sm">
            </footer>
        </div>
    </div>

    <div id="modal-slot" class="relative z-[9999]"></div>

    <script src="/js/sidebar.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/tax-account-manager.js"></script>

    <script>
        // Hàm nạp linh kiện dùng chung
        async function includeComponent(slotId, filePath) {
            const slot = document.getElementById(slotId);
            if (!slot) return;

            try {
                // Thêm tham số ngẫu nhiên để tránh lỗi cache của WebView2 khi Thắng sửa file
                const response = await fetch(filePath + '?v=' + Math.random());
                if (!response.ok) throw new Error("Không tìm thấy file: " + filePath);

                const html = await response.text();
                slot.innerHTML = html;

                // Làm tươi lại cấu hình Tailwind sau khi nạp HTML mới
                if (window.tailwind) {
                    tailwind.config = tailwind.config;
                }
                console.log(`[Success] Đã nạp: ${filePath}`);
            } catch (err) {
                console.error(`[Error] Lỗi nạp component ${filePath}:`, err);
                slot.innerHTML = `<div class="p-4 text-red-500 bg-red-50 rounded-2xl border border-red-100 text-sm">
                                    Lỗi nạp thành phần: ${filePath}
                                </div>`;
            }
        }

        // Luồng khởi chạy chính
        window.addEventListener('DOMContentLoaded', async () => {
            // Chạy song song tất cả các thành phần khung
            // Tốc độ nạp sẽ bằng tốc độ của file chậm nhất, thay vì cộng dồn lại
            await Promise.all([
                includeComponent('sidebar-slot', 'components/sidebar.html'),
                includeComponent('header-slot', 'header.html'),
                includeComponent('footer-slot', 'footer.html'),
                includeComponent('modal-slot', 'components/logout_modal.html')
            ]);

            // Sau khi khung đã lên, nạp nội dung chính
            includeComponent('main-content-slot', 'components/settings_content.html');
        });
    </script>
</body>
</html>
