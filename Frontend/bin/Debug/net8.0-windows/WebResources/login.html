<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxScraper Login</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="/js/tailwind.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'tax-dark': '#2D3748', 'tax-blue': '#3182CE' }
                }
            }
        }
    </script>
</head>
<body class="antialiased text-gray-900">

    <div class="login-card">
        <div class="w-[40%] bg-tax-dark p-10 flex flex-col justify-between text-white border-none">
            <div>
                <div class="w-14 h-14 bg-tax-blue rounded-xl flex items-center justify-center mb-5 shadow-lg">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 002 2h2a2 2 0 002-2"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold tracking-tight mb-2">TaxScraper</h1>
                <p class="text-blue-200 opacity-90 text-sm mb-16">Hệ thống khai thác dữ liệu</p>
            </div>

            <div class="space-y-4 text-xs text-gray-400">
                <div class="flex items-center gap-3">
                    <div class="w-1.5 h-1.5 bg-blue-400 rounded-full"></div>
                    <p>Cập nhật dữ liệu thời gian thực</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-1.5 h-1.5 bg-blue-400 rounded-full"></div>
                    <p>Bảo mật chuẩn quốc tế</p>
                </div>
            </div>
        </div>

        <div class="w-[60%] bg-white p-14 flex flex-col justify-center border-none">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-1 font-sans">Chào mừng trở lại!</h2>
                <p class="text-gray-500 text-sm">Vui lòng đăng nhập để tiếp tục làm việc.</p>
            </div>

            <div class="space-y-5">
                <div class="input-group">
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    <input type="text" id="user" placeholder="Tài khoản hoặc Email" class="tax-input font-sans">
                </div>

                <div class="input-group">
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    <input type="password" id="pass" placeholder="Mật khẩu" class="tax-input font-sans">
                </div>

                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center gap-2 text-gray-500 select-none cursor-pointer">
                        <input type="checkbox" id="remember" class="w-3.5 h-3.5 rounded border-gray-300 text-tax-blue focus:ring-tax-blue">
                        Duy trì đăng nhập
                    </label>
                    <a href="#" class="text-tax-blue hover:text-blue-700 font-medium">Quên mật khẩu?</a>
                </div>

                <button onclick="guiLenhDangNhap()"
                        class="w-full bg-tax-blue hover:bg-blue-700 text-white text-sm font-semibold py-3.5 rounded-lg shadow-md transition-all duration-150 transform active:scale-[0.98]">
                    ĐĂNG NHẬP
                </button>
            </div>

            <div class="mt-10 text-center text-xs text-gray-500">
                Chưa có quyền truy cập?
                <a href="javascript:void(0)"
                   onclick="showAlert('Yêu cầu cấp tài khoản', 'Vui lòng liên hệ Admin để được cấp quyền.\nSĐT: 0356.587.127 (Zalo)', 'success')"
                   class="text-tax-blue hover:text-blue-700 font-semibold ml-1 cursor-pointer">
                    Yêu cầu cấp tài khoản
                </a>
            </div>
        </div>
    </div>
    <script src="js/login.js"></script>
    <script src="js/common.js"></script>
</body>
</html>
